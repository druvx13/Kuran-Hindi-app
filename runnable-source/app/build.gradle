plugins {
    id 'com.android.application'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.muslim.quran_hindi"
        minSdk 16
        targetSdk 28
        versionCode 13
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/*.version',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.core:core:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'androidx.fragment:fragment:1.4.1'
    implementation 'androidx.viewpager:viewpager:1.0.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:30.3.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    // Google AdMob
    implementation 'com.google.android.gms:play-services-ads:20.6.0'

    // RecyclerView fast scroller (bundled as source — see src/main/java/com/futuremind/)
    // implementation 'com.github.futuremind:recycler-fast-scroll:0.2.5'

    // Clans Floating Action Button (bundled as source — see src/main/java/com/github/clans/)
    // implementation 'com.github.clans:fab:1.6.4'
}

apply plugin: 'com.google.gms.google-services'
